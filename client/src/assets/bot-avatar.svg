<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="botGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0" y1="18" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="eyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background badge with gradient -->
  <rect width="48" height="48" rx="24" fill="url(#botGrad)" />

  <!-- Antenna -->
  <path d="M24 7V13" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="24" cy="6" r="2.5" fill="#38bdf8" filter="url(#eyeGlow)" />

  <!-- Ears / Sensors -->
  <rect x="7" y="20" width="3" height="8" rx="1.5" fill="#bae6fd" />
  <rect x="38" y="20" width="3" height="8" rx="1.5" fill="#bae6fd" />

  <!-- Head Chassis -->
  <rect x="9.5" y="13.5" width="29" height="22" rx="6.5" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2" />

  <!-- Visor Display -->
  <rect x="13.5" y="17.5" width="21" height="14" rx="4" fill="url(#visorGrad)" stroke="#0ea5e9" stroke-width="1" />

  <!-- Glowing Cyan Eyes -->
  <circle cx="19" cy="23.5" r="2.5" fill="#22d3ee" filter="url(#eyeGlow)" />
  <circle cx="29" cy="23.5" r="2.5" fill="#22d3ee" filter="url(#eyeGlow)" />

  <!-- Pupils / Reflection -->
  <circle cx="19.8" cy="22.7" r="0.9" fill="#ffffff" />
  <circle cx="29.8" cy="22.7" r="0.9" fill="#ffffff" />

  <!-- Friendly Smile Curve -->
  <path d="M21 28.5C22.2 29.8 25.8 29.8 27 28.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Neck Base -->
  <path d="M19 36H29V39C29 40.5 27.8 41.5 26.5 41.5H21.5C20.2 41.5 19 40.5 19 39V36Z" fill="#94a3b8" />
</svg>

